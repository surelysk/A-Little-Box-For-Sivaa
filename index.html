<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080713">
<title>Kunjii Sammaanam</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

- {box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
background:#080713;color:#fff;
font-family:'Montserrat',sans-serif;overflow-x:hidden
}
button{font:inherit}

/* OPENING */
#opening{
position:relative;width:100%;min-height:560px;
height:100vh;height:100svh;overflow:hidden;
isolation:isolate;background:#080713
}
.world{
position:absolute;inset:0;
background:url("night-world.png") center/cover no-repeat;
transform:scale(1.03);
animation:worldBreath 18s ease-in-out infinite alternate
}
@keyframes worldBreath{
from{transform:scale(1.03)}to{transform:scale(1.07)}
}
.world::after{
content:"";position:absolute;inset:0;
background:
radial-gradient(circle at 50% 45%,transparent 20%,rgba(4,3,15,.18) 55%,rgba(3,2,12,.72) 100%),
linear-gradient(to bottom,rgba(3,3,15,.2),transparent 45%,rgba(3,2,12,.5))
}
.moonlight{
position:absolute;width:45vw;height:45vw;max-width:650px;max-height:650px;
top:-10%;right:-5%;border-radius:50%;
background:radial-gradient(circle,rgba(255,220,190,.16),rgba(190,160,255,.1) 25%,transparent 68%);
filter:blur(25px);pointer-events:none;
animation:moonGlow 6s ease-in-out infinite alternate;z-index:2
}
@keyframes moonGlow{
from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.06)}
}
.stars,.fireflies,.petals{
position:absolute;inset:0;pointer-events:none
}
.stars{z-index:3}.fireflies{z-index:7}
.petals{z-index:6;overflow:hidden}
.star{
position:absolute;width:2px;height:2px;border-radius:50%;
background:white;box-shadow:0 0 7px rgba(255,255,255,.9);
animation:twinkle var(--duration) ease-in-out infinite
}
.star.big{width:3px;height:3px}
@keyframes twinkle{
0%,100%{opacity:.25;transform:scale(.7)}
50%{opacity:1;transform:scale(1.5)}
}
.firefly{
position:absolute;width:5px;height:5px;border-radius:50%;
background:#ffd98a;box-shadow:0 0 8px #ffd98a,0 0 20px rgba(255,190,80,.7);
animation:fly var(--flytime) ease-in-out infinite,flicker 2s ease-in-out infinite alternate;
animation-delay:var(--delay)
}
@keyframes fly{
0%{transform:translate(0,0)}
25%{transform:translate(35px,-25px)}
50%{transform:translate(-15px,-65px)}
75%{transform:translate(-45px,-25px)}
100%{transform:translate(0,0)}
}
@keyframes flicker{from{opacity:.15}to{opacity:1}}
.petal{
position:absolute;width:7px;height:11px;
background:rgba(255,180,220,.75);
border-radius:80% 20% 80% 20%;
filter:blur(.2px);
animation:fall var(--falltime) linear infinite;
animation-delay:var(--delay)
}
@keyframes fall{
0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}
10%{opacity:.8}
50%{transform:translate3d(70px,50vh,0) rotate(180deg)}
100%{transform:translate3d(-50px,110vh,0) rotate(360deg);opacity:0}
}
.hero-content{
position:absolute;z-index:10;inset:0;
display:flex;flex-direction:column;align-items:center;
justify-content:center;text-align:center;
padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom))
}
.eyebrow{
font-size:clamp(9px,1.4vw,14px);letter-spacing:.42em;
text-transform:uppercase;color:rgba(255,235,220,.9);margin-bottom:15px
}
.title{
max-width:100%;font-family:'Cormorant Garamond',serif;
font-size:clamp(44px,8vw,105px);font-weight:500;line-height:.94;
color:#fff0df;text-shadow:0 0 10px rgba(255,220,190,.55),0 0 35px rgba(255,180,220,.25);
text-wrap:balance
}
.divider{display:flex;align-items:center;gap:15px;margin:17px 0 16px}
.divider span{display:block;width:65px;height:1px;background:rgba(255,220,200,.65)}
.heart{color:#ffd6cf;font-size:18px;text-shadow:0 0 15px rgba(255,170,150,.9)}
.subtitle{
font-family:'Cormorant Garamond',serif;font-style:italic;
font-size:clamp(20px,3vw,32px);color:#f8e6e3
}

/* GIFT */
.gift-wrap{
position:relative;margin-top:30px;cursor:pointer;
transition:transform .4s ease;-webkit-tap-highlight-color:transparent
}
.gift-wrap:hover{transform:translateY(-7px) scale(1.03)}
.gift-wrap:focus-visible{outline:2px solid #ffe0b8;outline-offset:12px;border-radius:8px}
.gift{
position:relative;width:150px;height:125px;
filter:drop-shadow(0 0 15px rgba(255,180,80,.65)) drop-shadow(0 15px 30px rgba(0,0,0,.5))
}
.gift-body{
position:absolute;left:10px;bottom:0;width:130px;height:90px;
border-radius:4px;background:linear-gradient(135deg,#8e294d,#d64b68 45%,#8f254b);
border:1px solid rgba(255,220,150,.5)
}
.gift-body::before{
content:"";position:absolute;left:54px;top:0;width:22px;height:100%;
background:linear-gradient(to right,#e6a52d,#ffd96d,#d99420)
}
.gift-lid{
position:absolute;left:0;top:25px;width:150px;height:32px;
border-radius:5px;background:linear-gradient(135deg,#c4385e,#ed6680,#a62b52);
border:1px solid rgba(255,225,170,.55);z-index:3
}
.gift-lid::before{
content:"";position:absolute;left:64px;top:0;width:22px;height:100%;
background:linear-gradient(to right,#e6a52d,#ffe27b,#d99420)
}
.bow-left,.bow-right{
position:absolute;top:0;width:43px;height:30px;background:#f4b63c;
border-radius:70% 15% 70% 15%;z-index:4
}
.bow-left{left:34px;transform:rotate(25deg)}
.bow-right{right:34px;transform:rotate(65deg)}
.bow-center{
position:absolute;z-index:5;top:5px;left:62px;width:27px;height:27px;
border-radius:50%;background:#ffd866;box-shadow:0 0 15px rgba(255,210,80,.8)
}
.gift-glow{
position:absolute;width:220px;height:100px;left:50%;bottom:-20px;
transform:translateX(-50%);
background:radial-gradient(ellipse,rgba(255,185,80,.55),transparent 70%);
filter:blur(12px);z-index:-1;
animation:giftGlow 2.5s ease-in-out infinite alternate
}
@keyframes giftGlow{
from{opacity:.45;transform:translateX(-50%) scale(.9)}
to{opacity:.9;transform:translateX(-50%) scale(1.15)}
}
.open-button{
margin-top:30px;padding:16px 30px;border-radius:40px;
border:1px solid rgba(255,220,210,.4);
background:rgba(30,20,38,.58);backdrop-filter:blur(12px);
color:#fff2eb;font-size:12px;font-weight:500;letter-spacing:.22em;
cursor:pointer;transition:.35s ease;
box-shadow:0 0 25px rgba(0,0,0,.25),inset 0 0 20px rgba(255,200,190,.05)
}
.open-button:hover{
background:rgba(100,50,90,.5);border-color:rgba(255,220,210,.8);
box-shadow:0 0 30px rgba(255,180,200,.25);transform:translateY(-3px)
}
.open-button:focus-visible,.back-button:focus-visible,.close:focus-visible{
outline:2px solid #ffe0b8;outline-offset:4px
}

/* INSIDE */
#inside{
display:none;position:relative;isolation:isolate;min-height:100vh;
background:#080713;padding:30px 20px 80px
}
#inside::before{
content:"";position:absolute;z-index:-1;inset:0;
background:url("night-world.png") center/cover no-repeat;
filter:blur(6px);opacity:.58;pointer-events:none
}
.inside-topbar{width:min(1000px,100%);margin:0 auto 40px}
.back-button{
display:inline-flex;align-items:center;gap:9px;padding:11px 17px;
border:1px solid rgba(255,220,220,.2);border-radius:30px;
background:rgba(255,255,255,.055);color:rgba(255,240,235,.9);
font-size:12px;cursor:pointer;transition:.3s ease
}
.back-button:hover{
background:rgba(255,255,255,.12);border-color:rgba(255,220,220,.4);
transform:translateX(-3px)
}
.inside-header{text-align:center;margin-bottom:48px}
.inside-header h1{
font-family:'Cormorant Garamond',serif;
font-size:clamp(45px,7vw,80px);font-weight:500;color:#ffe9df
}
.inside-header p{
margin-top:12px;color:rgba(255,235,230,.65);
font-size:12px;line-height:1.8;letter-spacing:.08em
}
.rooms{
width:min(1000px,100%);margin:auto;
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px
}
.room{
position:relative;min-height:170px;padding:27px 22px;
border-radius:20px;border:1px solid rgba(255,220,220,.12);
background:rgba(255,255,255,.045);backdrop-filter:blur(15px);
cursor:pointer;transition:.35s ease;overflow:hidden;
text-align:left;color:inherit;width:100%
}
.room::before{
content:"";position:absolute;inset:0;
background:radial-gradient(circle at top right,rgba(255,190,200,.13),transparent 60%);
opacity:0;transition:.35s ease;pointer-events:none
}
.room:hover{
transform:translateY(-5px);border-color:rgba(255,220,220,.3);
background:rgba(255,255,255,.07)
}
.room:hover::before{opacity:1}
.room-icon{position:relative;z-index:2;font-size:27px;margin-bottom:17px}
.room h2{
position:relative;z-index:2;font-family:'Cormorant Garamond',serif;
font-size:27px;font-weight:500;line-height:1.1;color:#ffe8e2
}
.room p{
position:relative;z-index:2;margin-top:9px;font-size:11px;
line-height:1.7;color:rgba(255,240,235,.58)
}

/* MODAL */
.modal{
position:fixed;inset:0;z-index:100;display:none;
align-items:center;justify-content:center;padding:18px;
background:rgba(3,2,10,.82);backdrop-filter:blur(14px)
}
.modal-box{
width:min(650px,100%);max-height:85vh;max-height:85dvh;
overflow-y:auto;padding:40px;border-radius:24px;
border:1px solid rgba(255,220,220,.18);
background:linear-gradient(145deg,rgba(55,35,65,.97),rgba(15,12,25,.98));
box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative
}
.modal-box h2{
padding-right:30px;font-family:'Cormorant Garamond',serif;
font-size:40px;line-height:1.1;color:#ffe9e0;margin-bottom:12px
}
.modal-subtitle{
color:rgba(255,210,210,.75);font-family:'Cormorant Garamond',serif;
font-style:italic;font-size:20px;line-height:1.5;margin-bottom:22px
}
.modal-text{
color:rgba(255,240,235,.78);line-height:1.9;font-size:14px;
white-space:pre-line
}
.close{
position:absolute;top:14px;right:18px;width:36px;height:36px;
border:0;border-radius:50%;background:rgba(255,255,255,.07);
color:white;font-size:25px;cursor:pointer
}
.action-link{
display:inline-block;margin-top:20px;padding:13px 20px;
border:1px solid rgba(255,220,210,.35);border-radius:30px;
color:#fff2eb;text-decoration:none;font-size:11px;
letter-spacing:.12em;background:rgba(255,255,255,.06);
transition:.3s ease
}
.action-link:hover{background:rgba(255,255,255,.13)}
.error-note{margin-top:22px;font-size:13px;line-height:1.8;color:#f4cbdc}
.last-intro{display:grid;gap:17px;margin-top:25px;text-align:center}
.last-intro p{
font-family:'Cormorant Garamond',serif;font-size:clamp(21px,4vw,27px);
line-height:1.45;color:#fbe8e7;animation:revealLine .8s both
}
.last-intro p:nth-child(2){animation-delay:.5s}
.last-intro p:nth-child(3){animation-delay:1s}
@keyframes revealLine{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

/* VIDEO COLLECTION */
.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:18px}
.video-card{
border:1px solid rgba(255,220,220,.14);border-radius:13px;
overflow:hidden;background:rgba(255,255,255,.05);cursor:pointer;
color:#fff;text-align:left
}
.video-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.video-card span{display:block;padding:10px;font-size:11px;line-height:1.5}
.video-card iframe{display:block;width:100%;aspect-ratio:16/9;border:0}

/* OPENING TRANSITION */
#opening.opening-out .gift-wrap{animation:giftDisappear 1.2s forwards}
#opening.opening-out .hero-content{animation:fadeOut 1.2s forwards;pointer-events:none}
#opening.opening-out::after{
content:"";position:absolute;inset:0;z-index:50;
background:radial-gradient(circle,#fff5e8 0%,rgba(255,210,180,.8) 15%,rgba(120,70,130,.5) 45%,rgba(5,3,15,1) 85%);
animation:lightBurst 1.5s ease forwards;pointer-events:none
}
@keyframes giftDisappear{
0%{transform:scale(1);opacity:1}
40%{transform:scale(1.2);opacity:1}
100%{transform:scale(.1);opacity:0}
}
@keyframes fadeOut{to{opacity:0;transform:scale(.95)}}
@keyframes lightBurst{
0%{opacity:0}35%{opacity:1}100%{opacity:0}
}

/* MOBILE */
@media(max-width:600px){
#opening{min-height:560px}
.world{background-position:60% center}
.hero-content{padding:22px 17px;padding-bottom:max(25px,env(safe-area-inset-bottom))}
.eyebrow{font-size:9px;letter-spacing:.34em;margin-bottom:12px}
.title{max-width:360px;font-size:clamp(42px,11vw,56px);line-height:.92}
.divider{margin:15px 0 13px;gap:12px}
.divider span{width:48px}
.subtitle{font-size:23px}
.gift-wrap{margin-top:22px;transform:scale(.86);transform-origin:top center;margin-bottom:-15px}
.gift-wrap:hover{transform:scale(.89)}
.open-button{margin-top:22px;padding:14px 23px;font-size:10px;letter-spacing:.16em;max-width:100%}
#inside{padding:22px 16px 60px}
.inside-topbar{margin-bottom:30px}
.inside-header{margin-bottom:35px}
.inside-header p{font-size:11px;letter-spacing:.04em}
.rooms{grid-template-columns:1fr;gap:14px}
.room{min-height:145px;padding:23px 20px}
.room-icon{margin-bottom:12px}
.room h2{font-size:26px}
.modal{padding:12px}
.modal-box{padding:34px 22px 28px;border-radius:20px;max-height:88vh;max-height:88dvh}
.modal-box h2{font-size:34px}
.modal-subtitle{font-size:19px}
.modal-text{font-size:13px;line-height:1.85}
.video-grid{grid-template-columns:1fr}
}
@media(max-height:720px) and (max-width:600px){
.hero-content{padding-top:14px;padding-bottom:14px}
.eyebrow{margin-bottom:8px}
.divider{margin:10px 0}
.gift-wrap{margin-top:12px;transform:scale(.72);margin-bottom:-28px}
.gift-wrap:hover{transform:scale(.75)}
.open-button{margin-top:14px}
}
@media(prefers-reduced-motion:reduce){
,::before,*::after{
animation-duration:.01ms!important;animation-iteration-count:1!important;
scroll-behavior:auto!important;transition-duration:.01ms!important
}
}
</style>
</head>

<body>
<section id="opening">
<div class="world"></div>
<div class="moonlight"></div>
<div class="stars" id="stars"></div>
<div class="fireflies" id="fireflies"></div>
<div class="petals" id="petals"></div>

<div class="hero-content">
<div class="eyebrow">A LITTLE SOMETHING</div>
<h1 class="title">Kunjii Sammaanam</h1>
<div class="divider"><span></span><div class="heart">♥</div><span></span></div>
<div class="subtitle">For Kunjii Kuttyy</div>

<div class="gift-wrap" role="button" tabindex="0" aria-label="Open the gift"
onclick="openSammanam()"
onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSammanam();}">
<div class="gift">
<div class="bow-left"></div>
<div class="bow-right"></div>
<div class="bow-center"></div>
<div class="gift-lid"></div>
<div class="gift-body"></div>
<div class="gift-glow"></div>
</div>
</div>
<button class="open-button" onclick="openSammanam()">THORKK 😌♥️</button>
</div>
</section>

<section id="inside">
<div class="inside-topbar">
<button class="back-button" onclick="backToHome()">
<span aria-hidden="true">←</span> Back to Home
</button>
</div>

<div class="inside-header">
<h1>For You.</h1>
<p>A little universe made from little things.</p>
</div>

<div class="rooms">
<button class="room" onclick="openRoom('letter')">
<div class="room-icon">💌</div>
<h2>A Letter for You</h2>
<p>Your birthday, and a year of you in my life.</p>
</button>

<button class="room" onclick="openRoom('photos')">
<div class="room-icon">📸</div>
<h2>Little Things</h2>
<p>Things weren't actually little.</p>
</button>

<button class="room" onclick="openRoom('music')">
<div class="room-icon">🎵</div>
<h2>Kunjii Playlist</h2>
<p>Music from you, for you—and maybe someday, with you.</p>
</button>

<button class="room" onclick="openRoom('poetry')">
<div class="room-icon">✍️</div>
<h2>Words I Couldn't Say</h2>
<p>Words, poems, and little pieces of my mind of you.</p>
</button>

<button class="room" onclick="openRoom('why')">
<div class="room-icon">💭</div>
<h2>Why?</h2>
<p>Some questions, and the reasons behind them.</p>
</button>

<button class="room" onclick="openRoom('behind')">
<div class="room-icon">🎥</div>
<h2>Behind the Box</h2>
<p>The journey of how this little world came to life.</p>
</button>

<button class="room" onclick="openRoom('last')">
<div class="room-icon">❤️</div>
<h2>Open Last</h2>
<p>Some things are meant to be opened last.</p>
</button>
</div>
</section>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal-box">
<button class="close" onclick="closeRoom()" aria-label="Close">×</button>
<h2 id="modalTitle"></h2>
<div class="modal-subtitle" id="modalSubtitle"></div>
<div class="modal-text" id="modalText"></div>
</div>
</div>

<script>

"use strict";

/* BACKGROUND ANIMATIONS */
const starsContainer = document.getElementById("stars");
for(let i=0;i<95;i++){
const star=document.createElement("div");
star.className="star";
if(Math.random()>.85)star.classList.add("big");
star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*75+"%";
star.style.setProperty("--duration",(2+Math.random()*4)+"s");
star.style.setProperty("--delay",(Math.random()*5)+"s");
starsContainer.appendChild(star);
}

const firefliesContainer=document.getElementById("fireflies");
for(let i=0;i<28;i++){
const firefly=document.createElement("div");
firefly.className="firefly";
firefly.style.left=(5+Math.random()*90)+"%";
firefly.style.top=(25+Math.random()*65)+"%";
firefly.style.setProperty("--flytime",(6+Math.random()*9)+"s");
firefly.style.setProperty("--delay",(-Math.random()*10)+"s");
firefliesContainer.appendChild(firefly);
}

const petalsContainer=document.getElementById("petals");
for(let i=0;i<17;i++){
const petal=document.createElement("div");
petal.className="petal";
petal.style.left=Math.random()*100+"%";
petal.style.setProperty("--falltime",(8+Math.random()*8)+"s");
petal.style.setProperty("--delay",(-Math.random()*12)+"s");
petalsContainer.appendChild(petal);
}

/* OPEN GIFT */
let openingInProgress=false;

function openSammanam(){
if(openingInProgress)return;
openingInProgress=true;

const opening=document.getElementById("opening");
const inside=document.getElementById("inside");

opening.classList.add("opening-out");

setTimeout(()=>{
opening.style.display="none";
inside.style.display="block";
window.scrollTo(0,0);
openingInProgress=false;
},1350);
}

/* BACK TO HOME */
function backToHome(){
closeRoom();
document.getElementById("inside").style.display="none";

const opening=document.getElementById("opening");
opening.style.display="block";
opening.classList.remove("opening-out");

window.scrollTo(0,0);
}

/* ROOM CONTENT */
const rooms={
letter:{
title:"A Letter for You",
subtitle:"Your birthday, and a year of you in my life.",
link:"https://app.notion.com/p/Letter-3eaafb6ff1a980858fa8faf5d390baff?source=copy_link",
button:"SOMETHING MADE ONLY FOR YOU",
error:"Sorry for the technical error eee 🥲\n\nLink koode vaaychoo, allenkil website lag aavum, open cheyyaan pattulaa ennokke paranj escape aavalle 😂\n\nSorry for the inconvenience!\n\nXOXO 💗"
},

photos:{
title:"Little Things",
subtitle:"Things weren't actually little.",
text:"This little corner is waiting for its little things. 📸"
},

music:{
title:"Kunjii Playlist",
subtitle:"Every story deserves a soundtrack.",
text:`Every story deserves a soundtrack.

Some of these songs are ones you sent me.Some are songs I discovered because of you.Some simply remind me of you.

And maybe someday, there’ll be songs we listen to together.Maybe in a car.Maybe somewhere completely random.Maybe at some place neither of us has been before.

Until then, this playlist can wait for us.

You can add songs too, if you ever want to. Listen to them alone, listen to them together, add something for a particular mood, or just leave them here.

No rules🙂‍↔️. Nthylm njn daily ithilnn kekklnd😂🫶🫣..

Just music, little memories, and a few pieces of you that somehow became pieces of my story too. 🎵♥️`
},

poetry:{
title:"Words I Couldn't Say",
subtitle:"Words, poems, and little pieces of my mind of you.",
text:`One thing I've understood through all of this is that we don't need to be perfect. Maybe it's the little imperfections, the silly differences, the things we don't always understand about ourselves or each other, that make us who we are. And maybe love isn't about finding someone perfect. Maybe it's about understanding someone, accepting them as they are, and discovering whether two imperfect people can be right for each other.

I don't know what life has written for us. But I know that being imperfect has never made you any less wonderful in my eyes. ❤️

You already knew that I wrote poems, diaries, and little notes because of you. You knew I called you my poem. And then one day, you sent me that reel about how maybe all the poets should marry their poems.

And obviously, being me, I had to ask…

/* OPEN A ROOM */
function openRoom(roomName){
const room=rooms[roomName];
if(!room)return;

document.getElementById("modalTitle").textContent=room.title;
document.getElementById("modalSubtitle").textContent=room.subtitle;

const modalText=document.getElementById("modalText");
modalText.replaceChildren();

if(roomName==="behind"){
renderVideos(modalText);
}else if(roomName==="last"){
const link=document.createElement("a");
link.className="action-link";
link.href=room.link;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent=room.button;
modalText.appendChild(link);
}else{
if(room.text){
const paragraph=document.createElement("div");
paragraph.textContent=room.text;
modalText.appendChild(paragraph);
}

if(room.link){
const link=document.createElement("a");
link.className="action-link";
link.href=room.link;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent=room.button;
modalText.appendChild(link);
}

if(room.error){
const error=document.createElement("div");
error.className="error-note";
error.textContent=room.error;
modalText.appendChild(error);
}
}

document.getElementById("modal").style.display="flex";
}

/* LOAD A VIDEO ONLY WHEN IT IS TAPPED */
function renderVideos(container){
const grid=document.createElement("div");
grid.className="video-grid";

videos.forEach(([title,id])=>{
const card=document.createElement("button");
card.className="video-card";
card.type="button";
card.setAttribute("aria-label","Play "+title);

const thumbnail=document.createElement("img");
thumbnail.src="https://img.youtube.com/vi/"+id+"/hqdefault.jpg";
thumbnail.alt=title;
thumbnail.loading="lazy";

const caption=document.createElement("span");
caption.textContent=title;

card.appendChild(thumbnail);
card.appendChild(caption);

card.addEventListener("click",()=>{
const frame=document.createElement("iframe");
frame.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1";
frame.title=title;
frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
frame.allowFullscreen=true;

card.replaceChildren(frame);
});

grid.appendChild(card);
});

container.appendChild(grid);
}

/* CLOSE MODAL */
function closeRoom(){
document.getElementById("modal").style.display="none";
}

/* CLOSE WHEN THE BACKGROUND IS TAPPED */
document.getElementById("modal").addEventListener("click",function(event){
if(event.target===this)closeRoom();
});

/* ESCAPE KEY */
document.addEventListener("keydown",function(event){
if(event.key==="Escape")closeRoom();
});
