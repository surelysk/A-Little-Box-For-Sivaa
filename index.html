<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Kunjii Box for Kutty</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #100b1c, #24132f, #120d20);
      color: white;
      font-family: Georgia, serif;
      text-align: center;
      overflow: hidden;
    }

    .container {
      padding: 30px;
      max-width: 600px;
    }

    .small-text {
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      opacity: 0.7;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.7;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    .gift {
      font-size: 100px;
      cursor: pointer;
      transition: transform 0.4s ease;
      animation: float 3s ease-in-out infinite;
    }

    .gift:hover {
      transform: scale(1.08);
    }

    .open-button {
      margin-top: 25px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .open-button:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }

    .note {
      margin-top: 25px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      opacity: 0.45;
      letter-spacing: 1px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="small-text">
      Something made just for you
    </div>

    <h1>For Sivani</h1>

    <p class="subtitle">
      A little box of things<br>
      I wanted you to keep.
    </p>

    <div class="gift">🎁</div>

    <button class="open-button" onclick="openBox()">
      Open the Box
    </button>

    <div class="note">
      Take your time. There is no rush.
    </div>

  </div>

  <script>
    function openBox() {
      alert("The box is still being prepared... 🤍");
    }
  </script>

</body>
</html>
