<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Kunjii Box for Kunji Kuttyy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 50% 45%, #3b274b 0%, #171020 45%, #09070d 100%);

      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Soft floating lights */

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: twinkle 4s infinite ease-in-out;
    }

    .star:nth-child(1) { top: 15%; left: 18%; animation-delay: 0s; }
    .star:nth-child(2) { top: 27%; left: 78%; animation-delay: 1s; }
    .star:nth-child(3) { top: 63%; left: 12%; animation-delay: 2s; }
    .star:nth-child(4) { top: 72%; left: 85%; animation-delay: 0.5s; }
    .star:nth-child(5) { top: 12%; left: 55%; animation-delay: 2.5s; }
    .star:nth-child(6) { top: 82%; left: 43%; animation-delay: 1.5s; }
    .star:nth-child(7) { top: 38%; left: 91%; animation-delay: 3s; }
    .star:nth-child(8) { top: 48%; left: 7%; animation-delay: 2s; }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.8);
      }
    }

    /* Main content */

    .welcome {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 600px;
      text-align: center;

      animation: appear 2s ease forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .little {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(38px, 9vw, 64px);
      font-weight: normal;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: clamp(16px, 4vw, 20px);
      line-height: 1.8;
      opacity: 0.78;
      font-style: italic;
      margin-bottom: 38px;
    }

    /* Gift */

    .gift {
      font-size: 92px;
      display: inline-block;
      cursor: pointer;

      filter: drop-shadow(0 0 18px rgba(255,255,255,0.18));

      animation: float 4s ease-in-out infinite;

      transition:
        transform 0.4s ease,
        filter 0.4s ease;
    }

    .gift:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 30px rgba(255,255,255,0.35));
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Button */

    .open-button {
      display: block;
      margin: 30px auto 0;

      padding: 13px 28px;

      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 40px;

      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(10px);

      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 1px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.3s ease,
        border 0.3s ease;
    }

    .open-button:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.6);
    }

    .tiny {
      margin-top: 28px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;

      opacity: 0.35;
    }

    /* Small screens */

    @media (max-width: 480px) {
      .welcome {
        width: 88%;
      }

      .gift {
        font-size: 78px;
      }

      .subtitle {
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <!-- Background lights -->

  <div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>


  <!-- Welcome screen -->

  <main class="welcome">

    <div class="little">
      Something made just for you
    </div>

    <h1>
      For Sivani
    </h1>

    <p class="subtitle">
      A little box of things<br>
      I wanted you to keep.
    </p>

    <div class="gift">
      🎁
    </div>

    <button class="open-button" onclick="openBox()">
      Open the Box
    </button>

    <div class="tiny">
      Take your time. There is no rush.
    </div>

  </main>


  <script>

    function openBox() {

      alert(
        "The box is still being prepared... 🤍"
      );

    }

  </script>

</body>
      </html>
